<!DOCTYPE html>
<html>
<body>
<canvas id="c32" width="32" height="32"></canvas>
<canvas id="c180" width="180" height="180"></canvas>
<script>
const img = new Image();
img.onload = function() {
  ['c32','c180'].forEach(id => {
    const c = document.getElementById(id);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  });
  document.title = 'done';
};
img.src = 'favicon-raw.png';
</script>
</body>
</html>
